<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" role="img" aria-labelledby="title desc">
  <title id="title">Online Income System product cover</title>
  <desc id="desc">Retro styled digital product cover with templates, prompts, and online business symbols.</desc>
  <rect width="1536" height="1024" fill="#f7f0df"/>
  <filter id="grain">
    <feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="2" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="table" tableValues="0 .17"/></feComponentTransfer>
  </filter>
  <rect width="1536" height="1024" filter="url(#grain)" opacity=".48"/>
  <g transform="translate(170 125)">
    <rect x="132" y="0" width="895" height="750" rx="8" fill="#fff7e5" stroke="#1e1e1c" stroke-width="7"/>
    <rect x="132" y="0" width="895" height="118" fill="#d59a23"/>
    <rect x="132" y="635" width="895" height="115" fill="#f25e45"/>
    <circle cx="905" cy="190" r="120" fill="#0c6f73"/>
    <path d="M840 190h130M905 125v130" stroke="#fff7e5" stroke-width="20"/>
    <rect x="0" y="200" width="270" height="410" rx="7" fill="#0c6f73" stroke="#1e1e1c" stroke-width="5" transform="rotate(-8 135 405)"/>
    <rect x="900" y="255" width="265" height="390" rx="7" fill="#5f793f" stroke="#1e1e1c" stroke-width="5" transform="rotate(8 1032 450)"/>
    <g fill="#1e1e1c" font-family="Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif" font-weight="900">
      <text x="218" y="278" font-size="142">ONLINE</text>
      <text x="218" y="428" font-size="142">INCOME</text>
      <text x="218" y="562" font-size="126">SYSTEM</text>
      <text x="838" y="562" font-size="86" fill="#f25e45">TM</text>
    </g>
    <g font-family="Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif" font-size="44" fill="#fff7e5">
      <rect x="28" y="452" width="214" height="70" fill="#1e1e1c"/>
      <text x="69" y="501">PLAN</text>
      <rect x="928" y="478" width="202" height="70" fill="#1e1e1c"/>
      <text x="972" y="527">SCALE</text>
    </g>
    <g fill="#1e1e1c" opacity=".8">
      <circle cx="250" cy="150" r="8"/><circle cx="285" cy="150" r="8"/><circle cx="320" cy="150" r="8"/>
      <circle cx="250" cy="185" r="8"/><circle cx="285" cy="185" r="8"/><circle cx="320" cy="185" r="8"/>
      <circle cx="250" cy="220" r="8"/><circle cx="285" cy="220" r="8"/><circle cx="320" cy="220" r="8"/>
    </g>
  </g>
</svg>
