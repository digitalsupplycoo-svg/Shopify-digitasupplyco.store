<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" role="img" aria-labelledby="title desc">
  <title id="title">Amazon FBA Blueprint product cover</title>
  <desc id="desc">Retro styled digital product cover with blueprint shapes and ecommerce planning cards.</desc>
  <rect width="1536" height="1024" fill="#f7f0df"/>
  <filter id="grain">
    <feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="2" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="table" tableValues="0 .16"/></feComponentTransfer>
  </filter>
  <rect width="1536" height="1024" filter="url(#grain)" opacity=".5"/>
  <g transform="translate(165 118)">
    <rect x="160" y="0" width="875" height="760" rx="8" fill="#0c6f73" stroke="#1e1e1c" stroke-width="7"/>
    <path d="M160 0h875v144H160z" fill="#1e1e1c"/>
    <path d="M160 618h875v142H160z" fill="#d59a23"/>
    <rect x="0" y="178" width="268" height="430" rx="7" fill="#fff7e5" stroke="#1e1e1c" stroke-width="5" transform="rotate(-7 134 393)"/>
    <rect x="924" y="154" width="250" height="458" rx="7" fill="#f25e45" stroke="#1e1e1c" stroke-width="5" transform="rotate(8 1049 383)"/>
    <g stroke="#fff7e5" stroke-width="5" opacity=".65">
      <path d="M230 230h650M230 318h650M230 406h650M230 494h650"/>
      <path d="M295 170v390M450 170v390M605 170v390M760 170v390"/>
    </g>
    <g fill="#fff7e5" font-family="Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif" font-weight="900">
      <text x="225" y="258" font-size="132">AMAZON</text>
      <text x="225" y="410" font-size="174">FBA</text>
      <text x="225" y="548" font-size="128">BLUEPRINT</text>
      <text x="873" y="548" font-size="88" fill="#1e1e1c">TM</text>
    </g>
    <g font-family="Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif" font-size="42">
      <rect x="30" y="433" width="210" height="72" fill="#1e1e1c"/>
      <text x="61" y="482" fill="#fff7e5">SOURCING</text>
      <rect x="936" y="435" width="205" height="72" fill="#1e1e1c"/>
      <text x="971" y="484" fill="#fff7e5">LISTING</text>
    </g>
    <circle cx="925" cy="207" r="36" fill="#d59a23"/>
    <circle cx="936" cy="217" r="36" fill="none" stroke="#fff7e5" stroke-width="5"/>
  </g>
</svg>
